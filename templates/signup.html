
{% extends "base.html" %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">

        <h2>Create Account</h2>

        <p class="sub-text">
            Start your AI career journey with us.
        </p>

        <form method="POST">

            <div class="form-row">

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        minlength="6"
                        pattern="^(?=.*[A-Z])(?=.*[!@#$%^&*]).{6,}$"
                        title="Password must contain at least 6 characters, 1 uppercase letter and 1 special character"
                        required
                    >

                    <p class="sub-text">
                        Use at least 6 characters, 1 uppercase letter and 1 special character.
                    </p>
                </div>

            </div>

            <button type="submit">Sign Up</button>

        </form>

        <p class="switch-auth">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>
</div>

{% endblock %}
